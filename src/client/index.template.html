  <!--
    Early album fetch: runs before the stylesheet can block parsing and before ui.js is
    downloaded, so the API round-trip overlaps with CSS/JS loading. ui.js picks the
    promise up from window.__ohmyphotoAlbumFetch (see fetchAlbumOnce).
  -->
  <script>
    (function () {
      try {
        var parts = location.pathname.split('/').filter(Boolean);
        var albumId = parts[0] ? decodeURIComponent(parts[0]) : '';
        if (!albumId) return;
        // hash = "<secret>" or "<secret>/<photo ref>" (deep link to one photo); ui.js parses it the same way
        var secret = String(location.hash || '').replace(/^#/, '').split('/')[0];
        window.__ohmyphotoAlbumFetchKey = albumId + '#' + secret;
        window.__ohmyphotoAlbumFetch = fetch('/api/album/' + encodeURIComponent(albumId), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ secret: secret, turnstileToken: '' })
        });
        window.__ohmyphotoAlbumFetch.catch(function () {});
      } catch (e) {}
    })();
  </script>

  <!-- Local copy of the plushka.se stylesheet (see public/styles.css); bump ?v= when it changes -->
  <link rel="stylesheet" href="/styles.css?v=7b21f3c4">

  <!-- Perf/diagnostics: page start -->
  <script>
    // Basic timeline anchor available to ui.js
    window.__ohmyphotoStart = performance.now();
    console.log(`[ohmyphoto +0.0ms] page script start`, {
      href: location.href,
      timeOrigin: performance.timeOrigin
    });
    addEventListener('DOMContentLoaded', () => {
      console.log(`[ohmyphoto +${(performance.now() - window.__ohmyphotoStart).toFixed(1)}ms] DOMContentLoaded`);
    }, { once: true });
    addEventListener('load', () => {
      console.log(`[ohmyphoto +${(performance.now() - window.__ohmyphotoStart).toFixed(1)}ms] window.load`);
    }, { once: true });
  </script>

  <style>
    /* Local additions for empty-album status */
    #status { width: 100%; }
    .status-card {
      max-width: 760px;
      margin: 0 auto;
      padding: 18px 20px;
      border: 1px solid rgba(0, 0, 0, 0.10);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.85);
    }
    .status-card h1 {
      margin: 0 0 6px;
      font-size: 32px;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }
    .status-card p { margin: 10px 0; }
    .status-muted { opacity: 0.75; font-size: 14px; }

    /* Header: album title with the ZIP toolbar right under it (toolbar built client-side, see ui.js) */
    .header-brand { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
    /* Brand block is two lines tall now; keep the nav on the title line instead of vertically centred */
    .header .header-container { align-items: flex-start; }
    .header .nav-menu { margin-top: 4px; }
    .header-brand .logo { display: block; line-height: 1.2; }
    .album-toolbar { display: none; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin: 8px 0 0; }
    .album-toolbar[data-visible="1"] { display: flex; }
    .album-toolbar .album-btn { padding: 6px 12px; font-size: 14px; }
    @media (max-width: 768px) {
      .header .header-container { align-items: center; }
      .header .nav-menu { margin-top: 0; }
      .header-brand { align-items: center; text-align: center; }
      .album-toolbar { justify-content: center; }
    }
    /* Buttons follow the site palette (.cta-link in styles.css): light fill, #333 border, dark on hover */
    .album-btn, .status-card .access-btn {
      appearance: none; border: 1px solid #333; border-radius: 4px;
      padding: 10px 18px; font: inherit; font-size: 15px; cursor: pointer;
      background: #333; color: #fff; transition: background-color .3s ease, color .3s ease;
    }
    .album-btn.secondary { background: #f8f9fa; color: #333; }
    .album-btn:hover:not([aria-disabled="true"]), .status-card .access-btn:hover { background: #555; color: #fff; }
    .album-btn.secondary:hover { background: #333; }
    .album-btn[aria-disabled="true"] { opacity: 0.55; cursor: not-allowed; }
    .album-note { font-size: 14px; color: #666; }
    .album-note.warn { color: #8a3b12; }
    .status-card .access-form { margin-top: 12px; display: grid; gap: 10px; max-width: 520px; }
    .status-card .access-form label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
    .status-card .access-form input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 4px; font: inherit; }

    /* Lightbox: styles.css (plushka.se) expects a .lightbox-body wrapper + side panel.
       This gallery has neither, so make the content box fill the viewport on all sizes. */
    .lightbox .lightbox-content {
      position: absolute; inset: 0; width: 100%; height: 100%;
      padding: 16px 16px 56px; box-sizing: border-box;
      touch-action: pan-y pinch-zoom; /* horizontal swipes are ours (see ui.js) */
    }
    .lightbox .lightbox-content img { max-width: 100%; max-height: 100%; }
    /* Controls are real buttons (keyboard + screen readers); reset the UA button look */
    .lightbox button.lightbox-close, .lightbox button.lightbox-nav {
      appearance: none; border: 0; background: transparent; font: inherit; color: #fff; padding: 0;
    }
    .lightbox button.lightbox-close { font-size: 40px; font-weight: 700; line-height: 1; }
    .lightbox button.lightbox-nav { background-color: rgba(0, 0, 0, .5); font-size: 30px; }
    .lightbox button.lightbox-nav:hover { background-color: rgba(0, 0, 0, .8); }
    .lightbox button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .lightbox-bar {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 10001;
      display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap;
      padding: 12px 16px; color: #ddd; font-size: 14px;
      background: linear-gradient(to top, rgba(0, 0, 0, .6), rgba(0, 0, 0, 0));
    }
    .lightbox-bar .lightbox-name { max-width: 60vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lightbox-bar a { color: #fff; text-decoration: underline; }
    .lightbox-bar button.lightbox-copy {
      appearance: none; border: 0; background: transparent; padding: 0; font: inherit;
      color: #fff; text-decoration: underline; cursor: pointer;
    }
    .lightbox-bar button.lightbox-copy[data-copied="1"] { text-decoration: none; color: #9fe29f; }
    @media (max-width: 768px) {
      .lightbox .lightbox-content { flex: none; height: 100%; padding: 8px 8px 52px; }
      .lightbox button.lightbox-close { font-size: 35px; }
      .lightbox button.lightbox-nav { font-size: 24px; background-color: rgba(0, 0, 0, .7); }
    }
  </style>

<body>
  <header class="header">
    <div class="header-container">
      <!-- Do not use hash navigation (we use #secret) -->
      <div class="header-brand">
        <a id="logoLink" href="#" class="logo" aria-label="Home"><span id="title">OhMyPhoto</span></a>
        <h2 class="header-page-title"></h2>
        <div id="toolbar" class="album-toolbar"></div>
      </div>
      <nav>
        <ul class="nav-menu">
          <li><a href="https://plushka.se" target="_blank" rel="noreferrer">Maria Rytikova Photography</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <div id="page-content">
        <div id="status" style="padding:16px 0;"></div>
        <div id="grid" class="gallery-grid"></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <div class="newsletter-section" style="display: none;">
        <h3 class="newsletter-title">Get notified with new materials</h3>
        <form class="newsletter-form">
          <input type="email" class="newsletter-input" placeholder="Email Address" required>
          <button type="submit" class="newsletter-button">SUBSCRIBE</button>
        </form>
      </div>

      <div class="contact-info">
        <p>Contact: <a href="mailto:hello@plushka.se">hello@plushka.se</a></p>
      </div>
    </div>
  </footer>

  <!-- Turnstile containers:
       - Invisible/offscreen is used first (no UI).
       - Modal is shown only if invisible execution can't get a token (likely needs interaction). -->
  <div id="turnstile-offscreen" style="position:absolute;left:-9999px;top:0;width:1px;height:1px;overflow:hidden;">
    <div id="turnstile-widget-invisible"></div>
  </div>
  <div id="turnstile-modal"
    style="position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);z-index:9999;">
    <div style="background:#fff;border:1px solid #ddd;border-radius:10px;padding:16px;max-width:360px;width:calc(100% - 32px);">
      <div id="turnstile-widget-visible" style="min-height:72px;"></div>
    </div>
  </div>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close (Esc)">&times;</button>
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="">
    </div>
    <button type="button" class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous photo">&#10094;</button>
    <button type="button" class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next photo">&#10095;</button>
    <div class="lightbox-bar">
      <span id="lightbox-counter" aria-live="polite"></span>
      <span id="lightbox-name" class="lightbox-name"></span>
      <a id="lightbox-download" href="#" download>Download</a>
      <button type="button" class="lightbox-copy" id="lightbox-copy" aria-label="Copy a link to this photo">Copy link</button>
    </div>
  </div>

  <script>
    // Injected by build step (see scripts/build-assets.mjs)
    window.__turnstileSiteKey = '__TURNSTILE_SITE_KEY__';
  </script>
  <!-- ES module (deferred by default); imports /zip.js -->
  <script type="module" src="/ui.js"></script>
</body>

</html>
